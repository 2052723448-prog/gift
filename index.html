<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1712" />
    <title>给你的生日来信</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="book.css?v=bookfx-20261002-v11" />
    <link rel="stylesheet" href="styles.css?v=bookfx-20261001-v7" />
  </head>
  <body>
    <main class="scene" aria-label="生日来信互动场景">
      <div class="scene__grain" aria-hidden="true"></div>
      <div class="scene__ornaments" aria-hidden="true">
        <img class="scene__corner scene__corner--top-left" src="assets/ornaments/filigree-corner.png" alt="" />
        <img class="scene__corner scene__corner--top-right" src="assets/ornaments/filigree-corner.png" alt="" />
        <img class="scene__corner scene__corner--bottom-left" src="assets/ornaments/filigree-corner.png" alt="" />
        <img class="scene__corner scene__corner--bottom-right" src="assets/ornaments/filigree-corner.png" alt="" />
        <img class="scene__sprig scene__sprig--left" src="assets/ornaments/oak-sprig.png" alt="" />
        <img class="scene__sprig scene__sprig--right" src="assets/ornaments/oak-sprig.png" alt="" />
        <img class="scene__crest" src="assets/ornaments/fleur-de-lis.png" alt="" />
      </div>
      <section class="mail-stage" aria-label="可拆开的生日信封">
        <div class="mail-stage__halo" aria-hidden="true"></div>
        <div class="envelope-wrap" id="envelopeWrap">
          <article class="envelope" id="envelope" aria-label="生日信封">
            <div class="envelope-art" id="envelopeArt">
              <img class="envelope-art__image envelope-art__image--closed" src="assets/birthday-envelope-closed.webp" alt="复古生日信封，蜡封完好" fetchpriority="high" />
              <img class="envelope-art__image envelope-art__image--open" data-src="assets/birthday-envelope-open-personalized.webp" alt="拆开的复古生日信件，写着恭喜余芷琳解锁十八岁，并附上来自陆星燃的祝福" />
              <button class="seal-hit" id="sealButton" type="button" aria-label="打开生日信封" aria-expanded="false" aria-controls="envelopeArt"><span>✦</span></button>
            </div>
          </article>
        </div>
        <div class="mail-stage__footer">
          <img class="botanical-divider" src="assets/ornaments/botanical-divider.png" alt="" aria-hidden="true" />
          <div class="mail-stage__actions">
            <p class="mail-stage__hint" id="hint"><span class="hint__dot"></span> 点击蜡封，拆开这封生日来信</p>
            <div class="mail-stage__button-stack">
              <button class="replay" id="replayButton" type="button" disabled tabindex="-1" aria-hidden="true">
                <img src="assets/ornaments/parchment-scroll.png" alt="" aria-hidden="true" />
                <span>收起信件 <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M6 5H3V2M3 5a7 7 0 1 1-1 7" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
              </button>
              <button class="continue-button" id="continueButton" type="button" disabled tabindex="-1" aria-hidden="true">
                <img src="assets/ornaments/parchment-scroll.png" alt="" aria-hidden="true" />
                <span>继续 <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10h11M10 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="book-overlay" id="bookOverlay" aria-label="可拖拽翻页的生日记忆书" hidden>
        <div class="app">
          <div class="book" id="book" role="region" aria-roledescription="翻页书" aria-label="对开书页，左右滑动或拖动书角翻页">
            <div class="slot slot--left" id="slotLeft"></div>
            <div class="slot slot--right" id="slotRight"></div>

            <div class="flip" id="flip" aria-hidden="true" hidden>
              <div class="flip__under">
                <div class="flip__holder" id="flipUnder"></div>
              </div>
              <div class="flip__holder flip__front" id="flipFront"></div>
              <div class="flip__flap">
                <div class="flip__back" id="flipBack">
                  <div class="flip__holder" id="flipBackPage"></div>
                </div>
              </div>
            </div>
          </div>

          <nav class="controls" aria-label="翻页">
            <button class="ctrl" id="prevBtn" type="button" aria-label="上一页">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <span class="counter" id="counter" role="status" aria-live="polite">封面</span>
            <button class="ctrl" id="nextBtn" type="button" aria-label="下一页">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <button class="book-back" id="bookBack" type="button">返回生日信件</button>
          </nav>
        </div>
      </section>

      <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    </main>

    <dialog class="viewer" id="viewer" aria-label="放大查看纸条">
      <div class="viewer__scroll" id="viewerScroll">
        <img id="viewerImg" alt="" />
      </div>
      <div class="viewer__bar">
        <button type="button" id="viewerZoom" aria-pressed="false">放大</button>
        <button type="button" id="viewerClose">关闭</button>
      </div>
    </dialog>

    <audio id="backgroundMusic" preload="auto" loop aria-label="生日背景音乐">
      <source src="assets/audio/birthday-background.mp3?v=20261002-trim3s" type="audio/mpeg" />
    </audio>

    <script src="script.js?v=birthday-envelope-20261001-v6"></script>
    <script src="book.js?v=bookfx-20261002-v8"></script>
  </body>
</html>
